<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        /* box-level */
        h1{
            background-color: lightblue;
            height: 300px;
            width: 300px;
            border-width: 3px;
            border-style: solid;
            text-align: center;
            justify-content: center;

            border-radius: 20px;

            padding: 10px 20px;

            margin: auto;
        }
        /* inline-level */
        a{
            border-width: 1px;
            border-style: solid;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplo de box-level, mas os <a href="#">links</a> são exemplos de caixas inline-level.</p>
</body>
</html>
